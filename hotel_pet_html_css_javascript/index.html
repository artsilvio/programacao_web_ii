<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Login</title>

    <link rel="stylesheet" href="css/estilo.css">

</head>


<body>

    <main class="pagina-login">


        <!-- ÁREA DA IMAGEM -->

        <section class="login-imagem">

            <img src="imagens/cachorro_e_gato_inicial.jpg" alt="Cachorro e gato">

        </section>


        <!-- ÁREA DO LOGIN -->

        <section class="login-conteudo">


            <!-- CABEÇALHO -->

            <header class="cabecalho-login">

                <h1>
                    Hotel Pet
                </h1>

                <p>
                    Sistema de gerenciamento de hospedagem para Pets
                </p>

            </header>


            <h2>
                Login
            </h2>


            <!-- FORMULÁRIO -->

            <form>


                <!-- LOGIN -->

                <div class="campo-formulario">

                    <label for="login">
                        Login
                    </label>

                    <input type="text" id="login" name="login" placeholder="Digite seu login">

                </div>


                <!-- SENHA -->

                <div class="campo-formulario">

                    <label for="senha">
                        Senha
                    </label>

                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha">

                </div>


                <!-- OPÇÕES -->

                <div class="opcoes-login">


                    <div class="manter-conectado">

                        <input type="checkbox" id="manter-conectado" name="manter-conectado">

                        <label for="manter-conectado">
                            Manter-me conectado
                        </label>

                    </div>


                    <a href="#">
                        Esqueci a senha
                    </a>


                </div>


                <!-- BOTÃO ENTRAR -->


                <button type="button" id="btn-login" class="botao-login">
                    Entrar
                </button>



            </form>


            <!-- DIVISOR -->

            <div class="divisor">

                <span>
                    ou
                </span>

            </div>


            <!-- REDES SOCIAIS -->

            <div class="login-redes">


                <a href="#">

                    <img src="imagens/logo_facebook.png" alt="Facebook">

                    <span>
                        Entrar com Facebook
                    </span>

                </a>


                <a href="#">

                    <img src="imagens/logo_twitter.png" alt="Twitter">

                    <span>
                        Entrar com Twitter
                    </span>

                </a>


                <a href="#">

                    <img src="imagens/logo_google.png" alt="Google">

                    <span>
                        Entrar com Google
                    </span>

                </a>


            </div>


            <!-- CRIAR CONTA -->

            <p class="criar-conta">

                Ainda não possui uma conta?

                <a href="criar_conta.html">
                    Criar uma conta
                </a>

            </p>


        </section>


    </main>

    <script src="js/script.js"></script>

</body>

</html>
