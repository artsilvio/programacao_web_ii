<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fazer Reserva - Hotel Pet</title>

    <link rel="stylesheet" href="css/estilo.css">

</head>


<body>


    <div class="pagina">


        <!-- =====================================================
             CABEÇALHO
             ===================================================== -->

        <header class="cabecalho">


            <div class="logo-area">

                <h1>
                    Hotel Pet
                </h1>

                <p>
                    Sistema de gerenciamento de hospedagem para Pets
                </p>

            </div>


            <nav class="menu">

                <a href="reservas.html" class="ativo">
                    Reservas
                </a>

                <a href="pets.html">
                    Pets
                </a>

                <a href="usuarios.html">
                    Usuários
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

            </nav>


            <div class="usuario-area">

                <span>
                    Usuário:
                    <strong>Gerente</strong>
                </span>

                <span class="separador">
                    |
                </span>

                <a href="editar_perfil.html?origem=perfil">
                    Meu perfil
                </a>

                <span class="separador">
                    |
                </span>

                <a href="index.html">
                    Sair
                </a>

            </div>


        </header>



        <!-- =====================================================
             CONTEÚDO
             ===================================================== -->

        <main class="conteudo">


            <div class="titulo-pagina">

                <div>

                    <h2>
                        Fazer reserva
                    </h2>

                    <p>
                        Cadastre uma nova reserva de hospedagem.
                    </p>

                </div>

            </div>



            <!-- =====================================================
                 FORMULÁRIO
                 ===================================================== -->

            <section class="formulario-card">


                <form id="form-fazer-reserva">


                    <!-- =================================================
                         DADOS DA RESERVA
                         ================================================= -->

                    <div class="grupo-formulario">


                        <h3>
                            Dados da reserva
                        </h3>


                        <div class="linha-formulario">


                            <!-- PET -->

                            <div class="campo-formulario">

                                <label for="pet">
                                    Pet
                                </label>

                                <select id="pet" name="pet" required>

                                    <option value="" selected disabled>
                                        Selecione o pet
                                    </option>

                                    <option value="thor">
                                        Thor
                                    </option>

                                    <option value="mel">
                                        Mel
                                    </option>

                                    <option value="nina">
                                        Nina
                                    </option>

                                    <option value="simba">
                                        Simba
                                    </option>

                                </select>

                            </div>



                            <!-- PROPRIETÁRIO -->

                            <div class="campo-formulario">

                                <label for="proprietario">
                                    Proprietário
                                </label>

                                <select id="proprietario" name="proprietario" required>

                                    <option value="" selected disabled>
                                        Selecione o proprietário
                                    </option>

                                    <option value="carlos">
                                        Carlos Oliveira
                                    </option>

                                    <option value="ana">
                                        Ana Souza
                                    </option>

                                    <option value="joao">
                                        João Santos
                                    </option>

                                    <option value="mariana">
                                        Mariana Costa
                                    </option>

                                </select>

                            </div>


                        </div>


                    </div>



                    <!-- =================================================
                         PERÍODO DA HOSPEDAGEM
                         ================================================= -->

                    <div class="grupo-formulario">


                        <h3>
                            Período da hospedagem
                        </h3>


                        <div class="linha-formulario">


                            <!-- DATA DE ENTRADA -->

                            <div class="campo-formulario">

                                <label for="entrada">
                                    Data de entrada
                                </label>

                                <input type="date" id="entrada" name="entrada" required>

                            </div>



                            <!-- DATA DE SAÍDA -->

                            <div class="campo-formulario">

                                <label for="saida">
                                    Data de saída
                                </label>

                                <input type="date" id="saida" name="saida" required>

                            </div>


                        </div>


                    </div>



                    <!-- =================================================
                         OBSERVAÇÕES
                         ================================================= -->

                    <div class="grupo-formulario">


                        <h3>
                            Observações
                        </h3>


                        <div class="campo-formulario">

                            <label for="observacoes">
                                Observações da reserva
                            </label>

                            <textarea id="observacoes" name="observacoes" rows="5"
                                placeholder="Digite alguma observação sobre a hospedagem..."></textarea>

                        </div>


                    </div>



                    <!-- =================================================
                         BOTÕES
                         ================================================= -->

                    <div class="acoes-formulario">


                        <a href="reservas.html" class="botao-cancelar">
                            Cancelar
                        </a>


                        <button type="submit" class="botao-principal">
                            Salvar reserva
                        </button>


                    </div>


                </form>


            </section>


        </main>


    </div>

    <script src="js/salvar_reserva.js"></script>

</body>

</html>
