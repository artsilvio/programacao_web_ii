<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar usuário - Hotel Pet</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <div class="pagina">

        <header class="cabecalho">

            <div class="logo-area">
                <h1>Hotel Pet</h1>
                <p>Sistema de gerenciamento de hospedagem para Pets</p>
            </div>

            <nav class="menu">
                <a href="reservas.html">Reservas</a>
                <a href="pets.html">Pets</a>
                <a href="usuarios.html" class="ativo">Usuários</a>
                <a href="configuracoes.html">Configurações</a>
            </nav>

            <div class="usuario-area">
                <span>Usuário: <strong>Gerente</strong></span>
                <span class="separador">|</span>
                <a href="editar_perfil.html?origem=perfil">Meu perfil</a>
                <span class="separador">|</span>
                <a href="index.html">Sair</a>
            </div>

        </header>

        <main class="conteudo">

            <div class="titulo-pagina">
                <div>
                    <h2>Editar usuário</h2>
                    <p>Atualize os dados do usuário cadastrado.</p>
                </div>
            </div>

            <section class="formulario-card">

                <form id="form-editar-usuario">

                    <div class="grupo-formulario">
                        <h3>Dados pessoais</h3>

                        <div class="linha-formulario">

                            <div class="campo-formulario">
                                <label for="nome">Nome completo</label>
                                <input type="text" id="nome" name="nome" required>
                            </div>

                            <div class="campo-formulario">
                                <label for="email">E-mail</label>
                                <input type="email" id="email" name="email" required>
                            </div>

                        </div>
                    </div>

                    <div class="grupo-formulario">
                        <h3>Dados de acesso</h3>

                        <div class="linha-formulario">

                            <div class="campo-formulario">
                                <label for="login">Login</label>
                                <input type="text" id="login" name="login" required>
                            </div>

                            <div class="campo-formulario">
                                <label for="funcao">Função</label>

                                <select id="funcao" name="funcao" required>
                                    <option value="cliente">Cliente</option>
                                    <option value="funcionario">Funcionário</option>
                                    <option value="gerente">Gerente</option>
                                </select>
                            </div>

                        </div>

                        <div class="linha-formulario">

                            <div class="campo-formulario">
                                <label for="status">Status</label>

                                <select id="status" name="status" required>
                                    <option value="ativo">Ativo</option>
                                    <option value="inativo">Inativo</option>
                                </select>
                            </div>

                        </div>
                    </div>

                    <div class="acoes-formulario">

                        <a href="usuarios.html" class="botao-cancelar">
                            Cancelar
                        </a>

                        <button type="submit" class="botao-principal">
                            Salvar alterações
                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>
    <script src="js/proteger_pagina.js"></script>
    <script src="js/editar_usuario.js"></script>
    <script src="js/logout.js"></script>
</body>

</html>
