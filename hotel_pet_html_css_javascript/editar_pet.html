<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Pet - Hotel Pet</title>

    <link rel="stylesheet" href="css/estilo.css">

</head>


<body>


    <div class="pagina">


        <!-- =====================================================
             CABEÇALHO
             ===================================================== -->

        <header class="cabecalho">


            <div class="logo-area">

                <h1>
                    Hotel Pet
                </h1>

                <p>
                    Sistema de gerenciamento de hospedagem para Pets
                </p>

            </div>


            <nav class="menu">

                <a href="reservas.html">
                    Reservas
                </a>

                <a href="pets.html" class="ativo">
                    Pets
                </a>

                <a href="usuarios.html">
                    Usuários
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

            </nav>


            <div class="usuario-area">

                <span>
                    Usuário:
                    <strong>Gerente</strong>
                </span>

                <span class="separador">
                    |
                </span>

                <a href="editar_perfil.html?origem=perfil">
                    Meu perfil
                </a>

                <span class="separador">
                    |
                </span>

                <a href="index.html">
                    Sair
                </a>

            </div>


        </header>



        <!-- =====================================================
             CONTEÚDO
             ===================================================== -->

        <main class="conteudo">


            <!-- TÍTULO -->

            <div class="titulo-pagina">

                <div>

                    <h2>
                        Editar pet
                    </h2>

                    <p>
                        Altere os dados cadastrados do pet.
                    </p>

                </div>

            </div>



            <!-- =====================================================
                 FORMULÁRIO
                 ===================================================== -->

            <section class="formulario-card">


                <form id="form-editar-pet" enctype="multipart/form-data">


                    <!-- =================================================
                         DADOS DO PET
                         ================================================= -->

                    <div class="grupo-formulario">


                        <h3>
                            Dados do pet
                        </h3>


                        <div class="linha-formulario">


                            <!-- NOME -->

                            <div class="campo-formulario">

                                <label for="nome">
                                    Nome do pet
                                </label>

                                <input type="text" id="nome" name="nome" value="Thor" required>

                            </div>



                            <!-- TIPO -->

                            <div class="campo-formulario">

                                <label for="tipo">
                                    Tipo
                                </label>

                                <select id="tipo" name="tipo" required>

                                    <option value="cachorro" selected>
                                        Cachorro
                                    </option>

                                    <option value="gato">
                                        Gato
                                    </option>

                                </select>

                            </div>


                        </div>



                        <div class="linha-formulario">


                            <!-- RAÇA -->

                            <div class="campo-formulario">

                                <label for="raca">
                                    Raça
                                </label>

                                <input type="text" id="raca" name="raca" value="Golden Retriever" required>

                            </div>



                            <!-- TAMANHO -->

                            <div class="campo-formulario">

                                <label for="tamanho">
                                    Tamanho
                                </label>

                                <select id="tamanho" name="tamanho" required>

                                    <option value="pequeno">
                                        Pequeno
                                    </option>

                                    <option value="medio">
                                        Médio
                                    </option>

                                    <option value="grande" selected>
                                        Grande
                                    </option>

                                </select>

                            </div>


                        </div>


                    </div>



                    <!-- =================================================
                         PROPRIETÁRIO
                         ================================================= -->

                    <div class="grupo-formulario">


                        <h3>
                            Proprietário
                        </h3>


                        <div class="linha-formulario">


                            <div class="campo-formulario">

                                <label for="proprietario">
                                    Proprietário
                                </label>

                                <select id="proprietario" name="proprietario" required>

                                    <option value="carlos" selected>
                                        Carlos Oliveira
                                    </option>

                                    <option value="ana">
                                        Ana Souza
                                    </option>

                                    <option value="joao">
                                        João Santos
                                    </option>

                                    <option value="mariana">
                                        Mariana Costa
                                    </option>

                                </select>

                            </div>


                        </div>


                    </div>



                    <!-- =================================================
                         FOTO ATUAL
                         ================================================= -->

                    <div class="grupo-formulario">


                        <h3>
                            Foto do pet
                        </h3>


                        <div class="foto-edicao-pet">


                            <div class="foto-atual-pet">

                                <img src="imagens/cachorro01.png" alt="Foto atual do cachorro Thor">

                            </div>


                            <div class="campo-formulario">


                                <label for="foto">
                                    Alterar foto
                                </label>


                                <input type="file" id="foto" name="foto" accept="image/png, image/jpeg">


                                <small>
                                    Formatos permitidos: JPG e PNG.
                                </small>


                            </div>


                        </div>


                    </div>



                    <!-- =================================================
                         OBSERVAÇÕES
                         ================================================= -->

                    <div class="grupo-formulario">


                        <h3>
                            Observações
                        </h3>


                        <div class="campo-formulario">


                            <label for="observacoes">
                                Observações
                            </label>


                            <textarea id="observacoes" name="observacoes" rows="5"
                                placeholder="Digite alguma observação sobre o pet..."></textarea>


                        </div>


                    </div>



                    <!-- =================================================
                         AÇÕES
                         ================================================= -->

                    <div class="acoes-formulario">


                        <a href="pets.html" class="botao-cancelar">
                            Cancelar
                        </a>


                        <button type="submit" class="botao-principal">
                            Salvar alterações
                        </button>


                    </div>


                </form>


            </section>


        </main>


    </div>

    <script src="js/editar_pet.js"></script>
</body>

</html>
