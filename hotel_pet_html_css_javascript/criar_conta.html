<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - Hotel Pet</title>

    <link rel="stylesheet" href="css/estilo.css">

</head>


<body>


    <div class="pagina">


        <!-- =====================================================
             CABEÇALHO
             ===================================================== -->

        <header class="cabecalho">


            <div class="logo-area">

                <h1>
                    Hotel Pet
                </h1>

                <p>
                    Sistema de gerenciamento de hospedagem para Pets
                </p>

            </div>


            <nav class="menu">

                <a href="reservas.html">
                    Reservas
                </a>

                <a href="pets.html">
                    Pets
                </a>

                <a href="usuarios.html">
                    Usuários
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

            </nav>


            <div class="usuario-area">

                <a href="index.html">
                    Entrar
                </a>

            </div>


        </header>



        <!-- =====================================================
             CONTEÚDO
             ===================================================== -->

        <main class="conteudo">


            <div class="titulo-pagina">

                <div>

                    <h2>
                        Criar conta
                    </h2>

                    <p>
                        Cadastre seus dados para acessar o Hotel Pet.
                    </p>

                </div>

            </div>



            <!-- =================================================
                 FORMULÁRIO
                 ================================================= -->

            <section class="formulario-card">


                <form id="form-editar-usuario">


                    <!-- =================================================
                         DADOS PESSOAIS
                         ================================================= -->

                    <div class="grupo-formulario">


                        <h3>
                            Dados pessoais
                        </h3>


                        <div class="linha-formulario">


                            <div class="campo-formulario">

                                <label for="nome">
                                    Nome completo
                                </label>

                                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo"
                                    required>

                            </div>


                            <div class="campo-formulario">

                                <label for="email">
                                    E-mail
                                </label>

                                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                            </div>


                        </div>


                    </div>



                    <!-- =================================================
                         DADOS DE ACESSO
                         ================================================= -->

                    <div class="grupo-formulario">


                        <h3>
                            Dados de acesso
                        </h3>


                        <div class="linha-formulario">


                            <div class="campo-formulario">

                                <label for="login">
                                    Login
                                </label>

                                <input type="text" id="login" name="login" placeholder="Digite seu login" required>

                            </div>


                        </div>


                        <div class="linha-formulario">


                            <div class="campo-formulario">

                                <label for="senha">
                                    Senha
                                </label>

                                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                            </div>


                            <div class="campo-formulario">

                                <label for="confirmar_senha">
                                    Confirmar senha
                                </label>

                                <input type="password" id="confirmar_senha" name="confirmar_senha"
                                    placeholder="Digite a senha novamente" required>

                            </div>


                        </div>


                    </div>



                    <!-- =================================================
                         TERMOS
                         ================================================= -->

                    <div class="grupo-formulario">


                        <label class="opcao-checkbox">

                            <input type="checkbox" id="termos" name="termos" required>

                            <span>
                                Concordo com os termos de uso do Hotel Pet.
                            </span>

                        </label>


                    </div>



                    <!-- =================================================
                         AÇÕES
                         ================================================= -->

                    <div class="acoes-formulario">


                        <a href="index.html" class="botao-cancelar">
                            Voltar
                        </a>


                        <button type="submit" class="botao-principal">
                            Criar conta
                        </button>


                    </div>


                </form>


            </section>



            <!-- =================================================
                 LINK PARA LOGIN
                 ================================================= -->

            <div class="link-login">

                <p>

                    Já possui uma conta?

                    <a href="index.html">
                        Entrar
                    </a>

                </p>

            </div>


        </main>


    </div>

    <script src="js/editar_usuario.js"></script>
</body>

</html>
