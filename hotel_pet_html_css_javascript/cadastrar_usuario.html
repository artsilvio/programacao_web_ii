<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Usuário - Hotel Pet</title>

    <link rel="stylesheet" href="css/estilo.css">

</head>


<body>


    <div class="pagina">


        <!-- =====================================================
             CABEÇALHO
             ===================================================== -->

        <header class="cabecalho">


            <div class="logo-area">

                <h1>
                    Hotel Pet
                </h1>

                <p>
                    Sistema de gerenciamento de hospedagem para Pets
                </p>

            </div>


            <nav class="menu">

                <a href="reservas.html">
                    Reservas
                </a>

                <a href="pets.html">
                    Pets
                </a>

                <a href="usuarios.html" class="ativo">
                    Usuários
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

            </nav>


            <div class="usuario-area">

                <span>
                    Usuário:
                    <strong>Gerente</strong>
                </span>

                <span class="separador">
                    |
                </span>

                <a href="editar_perfil.html?origem=perfil">
                    Meu perfil
                </a>

                <span class="separador">
                    |
                </span>

                <a href="index.html">
                    Sair
                </a>

            </div>


        </header>



        <!-- =====================================================
             CONTEÚDO
             ===================================================== -->

        <main class="conteudo">


            <!-- =================================================
                 TÍTULO
                 ================================================= -->

            <div class="titulo-pagina">


                <div>

                    <h2>
                        Cadastrar usuário
                    </h2>

                    <p>
                        Cadastre um novo usuário para acessar o Hotel Pet.
                    </p>

                </div>


            </div>



            <!-- =================================================
                 FORMULÁRIO
                 ================================================= -->

            <section class="formulario-card">


                <form id="form-salvar-usuario">


                    <!-- =================================================
                         DADOS DO USUÁRIO
                         ================================================= -->

                    <div class="grupo-formulario">


                        <h3>
                            Dados do usuário
                        </h3>


                        <div class="linha-formulario">


                            <!-- NOME -->

                            <div class="campo-formulario">

                                <label for="nome">
                                    Nome completo
                                </label>

                                <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" required>

                            </div>



                            <!-- LOGIN -->

                            <div class="campo-formulario">

                                <label for="login">
                                    Login
                                </label>

                                <input type="text" id="login" name="login" placeholder="Digite o login" required>

                            </div>


                        </div>



                        <div class="linha-formulario">


                            <!-- E-MAIL -->

                            <div class="campo-formulario">

                                <label for="email">
                                    E-mail
                                </label>

                                <input type="email" id="email" name="email" placeholder="Digite o e-mail" required>

                            </div>



                            <!-- FUNÇÃO -->

                            <div class="campo-formulario">

                                <label for="funcao">
                                    Função
                                </label>

                                <select id="funcao" name="funcao" required>

                                    <option value="">
                                        Selecione a função
                                    </option>

                                    <option value="cliente">
                                        Cliente
                                    </option>

                                    <option value="funcionario">
                                        Funcionário
                                    </option>

                                    <option value="gerente">
                                        Gerente
                                    </option>

                                </select>

                            </div>


                        </div>


                    </div>



                    <!-- =================================================
                         DADOS DE ACESSO
                         ================================================= -->

                    <div class="grupo-formulario">


                        <h3>
                            Dados de acesso
                        </h3>


                        <div class="linha-formulario">


                            <!-- SENHA -->

                            <div class="campo-formulario">

                                <label for="senha">
                                    Senha
                                </label>

                                <input type="password" id="senha" name="senha" placeholder="Digite a senha" required>

                            </div>



                            <!-- CONFIRMAR SENHA -->

                            <div class="campo-formulario">

                                <label for="confirmar_senha">
                                    Confirmar senha
                                </label>

                                <input type="password" id="confirmar_senha" name="confirmar_senha"
                                    placeholder="Digite a senha novamente" required>

                            </div>


                        </div>


                    </div>



                    <!-- =================================================
                         STATUS
                         ================================================= -->

                    <div class="grupo-formulario">


                        <h3>
                            Status do usuário
                        </h3>


                        <div class="linha-formulario">


                            <div class="campo-formulario">

                                <label for="status">
                                    Status
                                </label>

                                <select id="status" name="status" required>

                                    <option value="ativo" selected>
                                        Ativo
                                    </option>

                                    <option value="inativo">
                                        Inativo
                                    </option>

                                </select>

                            </div>


                        </div>


                    </div>



                    <!-- =================================================
                         OBSERVAÇÕES
                         ================================================= -->

                    <div class="grupo-formulario">


                        <h3>
                            Observações
                        </h3>


                        <div class="campo-formulario">


                            <label for="observacoes">
                                Observações
                            </label>


                            <textarea id="observacoes" name="observacoes" rows="5"
                                placeholder="Digite alguma observação sobre o usuário..."></textarea>


                        </div>


                    </div>



                    <!-- =================================================
                         AÇÕES
                         ================================================= -->

                    <div class="acoes-formulario">


                        <a href="usuarios.html" class="botao-cancelar">
                            Cancelar
                        </a>


                        <button type="submit" class="botao-principal">
                            Salvar usuário
                        </button>


                    </div>


                </form>


            </section>


        </main>


    </div>

    <script src="js/salvar_usuario.js"></script>
</body>

</html>
