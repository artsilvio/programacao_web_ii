<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservas - Hotel Pet</title>

    <link rel="stylesheet" href="css/estilo.css">

</head>


<body>


    <div class="pagina">


        <!-- =====================================================
             CABEÇALHO
             ===================================================== -->

        <header class="cabecalho">


            <div class="logo-area">

                <h1>
                    Hotel Pet
                </h1>

                <p>
                    Sistema de gerenciamento de hospedagem para Pets
                </p>

            </div>


            <nav class="menu">

                <a href="reservas.html" class="ativo">
                    Reservas
                </a>

                <a href="pets.html">
                    Pets
                </a>

                <a href="usuarios.html">
                    Usuários
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

            </nav>


            <div class="usuario-area">

                <span>
                    Usuário:
                    <strong>Gerente</strong>
                </span>

                <span class="separador">
                    |
                </span>

                <a href="editar_perfil.html?origem=perfil">
                    Meu perfil
                </a>

                <span class="separador">
                    |
                </span>

                <a href="index.html">
                    Sair
                </a>

            </div>


        </header>



        <!-- =====================================================
             CONTEÚDO
             ===================================================== -->

        <main class="conteudo">


            <!-- =================================================
                 TÍTULO
                 ================================================= -->

            <div class="titulo-pagina">


                <div>

                    <h2>
                        Reservas
                    </h2>

                    <p>
                        Gerencie as reservas de hospedagem dos pets.
                    </p>

                </div>


                <a href="fazer_reserva.html" class="botao-principal">
                    + Fazer reserva
                </a>


            </div>



            <!-- =================================================
                 FILTROS
                 ================================================= -->

            <section class="filtros">


                <div class="campo-pesquisa">

                    <label for="pesquisa">
                        Pesquisar
                    </label>

                    <input type="text" id="pesquisa" name="pesquisa" placeholder="Digite o nome do pet ou tutor">

                </div>


                <div class="campo-status">

                    <label for="status">
                        Status
                    </label>

                    <select id="status" name="status">

                        <option value="todos">
                            Todos
                        </option>

                        <option value="agendada">
                            Agendada
                        </option>

                        <option value="andamento">
                            Em andamento
                        </option>

                        <option value="finalizada">
                            Finalizada
                        </option>

                    </select>

                </div>

                <div class="campo-status">

                    <label for="tipo-pet">
                        Tipo de pet
                    </label>

                    <select id="tipo-pet" name="tipo-pet">
                        <option value="todos">Todos</option>
                        <option value="cachorro">Cachorro</option>
                        <option value="gato">Gato</option>
                    </select>

                </div>

                <button type="button" class="botao-filtrar">
                    Filtrar
                </button>


            </section>



            <!-- =================================================
                 LISTA DE RESERVAS
                 ================================================= -->

            <section class="lista-reservas">


                <div class="cabecalho-lista">
                    <h3 id="titulo-lista-reservas">
                        Reservas cadastradas
                    </h3>

                    <span id="contador-reservas">
                        3 reservas
                    </span>
                </div>

                <div id="lista-reservas-container">

                </div>

            </section>


        </main>


    </div>

    <script src="js/proteger_pagina.js"></script>
    <script src="js/buscas.js"></script>
    <script src="js/reservas.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/controle_acesso.js"></script>
</body>

</html>
