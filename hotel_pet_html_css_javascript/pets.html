<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pets - Hotel Pet</title>

    <link rel="stylesheet" href="css/estilo.css">

</head>


<body>


    <div class="pagina">


        <!-- =====================================================
             CABEÇALHO
             ===================================================== -->

        <header class="cabecalho">


            <div class="logo-area">

                <h1>
                    Hotel Pet
                </h1>

                <p>
                    Sistema de gerenciamento de hospedagem para Pets
                </p>

            </div>


            <nav class="menu">

                <a href="reservas.html">
                    Reservas
                </a>

                <a href="pets.html" class="ativo">
                    Pets
                </a>

                <a href="usuarios.html">
                    Usuários
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

            </nav>


            <div class="usuario-area">

                <span>
                    Usuário:
                    <strong>Gerente</strong>
                </span>

                <span class="separador">
                    |
                </span>

                <a href="editar_perfil.html?origem=perfil">
                    Meu perfil
                </a>

                <span class="separador">
                    |
                </span>

                <a href="index.html">
                    Sair
                </a>

            </div>


        </header>



        <!-- =====================================================
             CONTEÚDO
             ===================================================== -->

        <main class="conteudo">


            <!-- TÍTULO DA PÁGINA -->

            <div class="titulo-pagina">

                <div>

                    <h2>
                        Pets
                    </h2>

                    <p>
                        Gerencie os pets cadastrados no Hotel Pet.
                    </p>

                </div>


                <a href="cadastrar_pet.html" class="botao-principal">
                    + Cadastrar pet
                </a>

            </div>



            <!-- =====================================================
                 FILTROS
                 ===================================================== -->

            <section class="filtros">


                <div class="campo-pesquisa">

                    <label for="pesquisa">
                        Pesquisar
                    </label>

                    <input type="text" id="pesquisa" name="pesquisa" placeholder="Digite o nome do pet ou proprietário">

                </div>


                <div class="campo-status">

                    <label for="tipo">
                        Tipo
                    </label>

                    <select id="tipo" name="tipo">

                        <option value="todos">
                            Todos
                        </option>

                        <option value="cachorro">
                            Cachorro
                        </option>

                        <option value="gato">
                            Gato
                        </option>

                    </select>

                </div>


                <button type="button" class="botao-filtrar">
                    Filtrar
                </button>


            </section>



            <!-- =====================================================
                 LISTA DE PETS
                 ===================================================== -->

            <section class="lista-pets">


                <!-- CABEÇALHO DA LISTA -->

                <div class="cabecalho-lista">

                    <h3 id="titulo-lista-pets">
                        Pets cadastrados
                    </h3>

                    <span id="contador-pets">
                        4 pets
                    </span>

                </div>

                <!-- CONTAINER DOS PETS CADASTRADOS -->

                <div id="lista-pets-container"></div>
            </section>


        </main>


    </div>
    <script src="js/proteger_pagina.js"></script>
    <script src="js/pets.js"></script>
    <script src="js/buscas.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/controle_acesso.js"></script>
</body>

</html>
