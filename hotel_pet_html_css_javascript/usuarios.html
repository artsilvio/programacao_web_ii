<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuários - Hotel Pet</title>

    <link rel="stylesheet" href="css/estilo.css">

</head>


<body>


    <div class="pagina">


        <!-- =====================================================
             CABEÇALHO
             ===================================================== -->

        <header class="cabecalho">


            <div class="logo-area">

                <h1>
                    Hotel Pet
                </h1>

                <p>
                    Sistema de gerenciamento de hospedagem para Pets
                </p>

            </div>


            <nav class="menu">

                <a href="reservas.html">
                    Reservas
                </a>

                <a href="pets.html">
                    Pets
                </a>

                <a href="usuarios.html" class="ativo">
                    Usuários
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

            </nav>


            <div class="usuario-area">

                <span>
                    Usuário:
                    <strong>Gerente</strong>
                </span>

                <span class="separador">
                    |
                </span>

                <a href="editar_perfil.html?origem=perfil">
                    Meu perfil
                </a>

                <span class="separador">
                    |
                </span>

                <a href="index.html">
                    Sair
                </a>

            </div>


        </header>



        <!-- =====================================================
             CONTEÚDO
             ===================================================== -->

        <main class="conteudo">


            <!-- =================================================
                 TÍTULO
                 ================================================= -->

            <div class="titulo-pagina">


                <div>

                    <h2>
                        Usuários
                    </h2>

                    <p>
                        Gerencie os usuários cadastrados no Hotel Pet.
                    </p>

                </div>


                <a href="cadastrar_usuario.html" class="botao-principal">
                    + Cadastrar usuário
                </a>


            </div>



            <!-- =================================================
                 FILTROS
                 ================================================= -->

            <section class="filtros">


                <div class="campo-pesquisa">

                    <label for="pesquisa">
                        Pesquisar
                    </label>

                    <input type="text" id="pesquisa" name="pesquisa" placeholder="Digite o nome ou login do usuário">

                </div>


                <div class="campo-status">

                    <label for="funcao">
                        Função
                    </label>

                    <select id="funcao" name="funcao">

                        <option value="todos">
                            Todas
                        </option>

                        <option value="cliente">
                            Cliente
                        </option>

                        <option value="funcionario">
                            Funcionário
                        </option>

                        <option value="gerente">
                            Gerente
                        </option>

                    </select>

                </div>


                <button type="button" class="botao-filtrar">
                    Filtrar
                </button>


            </section>



            <!-- =================================================
                 USUÁRIOS CADASTRADOS
                 ================================================= -->

            <section class="lista-usuarios">


                <div class="cabecalho-lista">
                    <h3 id="titulo-lista-usuarios">Usuários cadastrados</h3>
                    <span id="contador-usuarios">0 usuários</span>
                </div>



                <!-- =================================================
                     TABELA
                     ================================================= -->

                <div class="tabela-container">


                    <table class="tabela-usuarios">


                        <thead>

                            <tr>

                                <th>
                                    Código
                                </th>

                                <th>
                                    Nome
                                </th>

                                <th>
                                    Login
                                </th>

                                <th>
                                    E-mail
                                </th>

                                <th>
                                    Função
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Ações
                                </th>

                            </tr>

                        </thead>


                        <tbody id="lista-usuarios">

                        </tbody>


                    </table>


                </div>


            </section>


        </main>


    </div>
    <script src="js/proteger_pagina.js"></script>
    <script src="js/buscas.js"></script>
    <script src="js/usuarios.js"></script>
    <script src="js/logout.js"></script>
</body>

</html>
