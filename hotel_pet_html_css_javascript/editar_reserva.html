<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Reserva - Hotel Pet</title>

    <link rel="stylesheet" href="css/estilo.css">

</head>


<body>


    <div class="pagina">


        <!-- =====================================================
             CABEÇALHO
             ===================================================== -->

        <header class="cabecalho">


            <div class="logo-area">

                <h1>
                    Hotel Pet
                </h1>

                <p>
                    Sistema de gerenciamento de hospedagem para Pets
                </p>

            </div>


            <nav class="menu">

                <a href="reservas.html" class="ativo">
                    Reservas
                </a>

                <a href="pets.html">
                    Pets
                </a>

                <a href="usuarios.html">
                    Usuários
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

            </nav>


            <div class="usuario-area">

                <span>
                    Usuário:
                    <strong>Gerente</strong>
                </span>

                <span class="separador">
                    |
                </span>

                <a href="editar_perfil.html?origem=perfil">
                    Meu perfil
                </a>

                <span class="separador">
                    |
                </span>

                <a href="index.html">
                    Sair
                </a>

            </div>


        </header>



        <!-- =====================================================
             CONTEÚDO
             ===================================================== -->

        <main class="conteudo">


            <div class="titulo-pagina">

                <div>

                    <h2>
                        Editar reserva
                    </h2>

                    <p>
                        Altere os dados da reserva de hospedagem.
                    </p>

                </div>

            </div>



            <!-- =====================================================
                 FORMULÁRIO
                 ===================================================== -->

            <section class="formulario-card">


                <form id="form-editar-reserva">


                    <!-- =================================================
                         IDENTIFICAÇÃO DA RESERVA
                         ================================================= -->

                    <div class="grupo-formulario">


                        <h3>
                            Reserva 001
                        </h3>


                        <div class="linha-formulario">


                            <div class="campo-formulario">

                                <label for="pet">
                                    Pet
                                </label>

                                <select id="pet" name="pet" required>

                                    <option value="thor" selected>
                                        Thor
                                    </option>

                                    <option value="mel">
                                        Mel
                                    </option>

                                    <option value="nina">
                                        Nina
                                    </option>

                                    <option value="simba">
                                        Simba
                                    </option>

                                </select>

                            </div>



                            <div class="campo-formulario">

                                <label for="proprietario">
                                    Proprietário
                                </label>

                                <input type="text" id="proprietario" name="proprietario" value="Carlos Oliveira"
                                    required>

                            </div>


                        </div>


                    </div>



                    <!-- =================================================
                         PERÍODO DA HOSPEDAGEM
                         ================================================= -->

                    <div class="grupo-formulario">


                        <h3>
                            Período da hospedagem
                        </h3>


                        <div class="linha-formulario">


                            <div class="campo-formulario">

                                <label for="entrada">
                                    Data de entrada
                                </label>

                                <input type="date" id="entrada" name="entrada" value="2026-08-20" required>

                            </div>



                            <div class="campo-formulario">

                                <label for="saida">
                                    Data de saída
                                </label>

                                <input type="date" id="saida" name="saida" value="2026-08-25" required>

                            </div>


                        </div>


                    </div>



                    <!-- =================================================
                         VALORES E STATUS
                         ================================================= -->

                    <div class="grupo-formulario">


                        <h3>
                            Valores e status
                        </h3>


                        <div class="linha-formulario">


                            <div class="campo-formulario">

                                <label for="valor">
                                    Valor da hospedagem
                                </label>

                                <input type="text" id="valor" name="valor" value="R$ 250,00" required>

                            </div>



                            <div class="campo-formulario">

                                <label for="status">
                                    Status
                                </label>

                                <select id="status" name="status" required>

                                    <option value="agendada" selected>
                                        Agendada
                                    </option>

                                    <option value="andamento">
                                        Em andamento
                                    </option>

                                    <option value="finalizada">
                                        Finalizada
                                    </option>

                                </select>

                            </div>


                        </div>


                    </div>



                    <!-- =================================================
                         OBSERVAÇÕES
                         ================================================= -->

                    <div class="grupo-formulario">


                        <h3>
                            Observações
                        </h3>


                        <div class="campo-formulario">

                            <label for="observacoes">
                                Observações da reserva
                            </label>

                            <textarea id="observacoes" name="observacoes" rows="5"
                                placeholder="Digite alguma observação sobre a reserva..."></textarea>

                        </div>


                    </div>



                    <!-- =================================================
                         BOTÕES
                         ================================================= -->

                    <div class="acoes-formulario">


                        <a href="ver_reserva.html" class="botao-cancelar">
                            Cancelar
                        </a>


                        <button type="submit" class="botao-principal">
                            Salvar alterações
                        </button>


                    </div>


                </form>


            </section>


        </main>


    </div>

    <script src="js/editar_reserva.js"></script>

</body>

</html>
